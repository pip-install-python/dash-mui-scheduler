<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Primary meta tags -->
    <title>dash-mui-scheduler — MUI X Scheduler for Plotly Dash</title>
    <meta name="title" content="dash-mui-scheduler — MUI X Scheduler for Plotly Dash">
    <meta name="description" content="A Plotly Dash wrapper for the MUI X Scheduler: EventCalendar, EventCalendarPremium and EventTimeline plus the RadialLineChart and RadialBarChart polar charts — recurrence, drag & resize, resources, timezones and theming, documented with live examples.">
    <meta name="keywords" content="dash-mui-scheduler, MUI X Scheduler, Plotly Dash, event calendar, timeline, radial charts, Dash components">
    <meta name="author" content="Pip Install Python LLC">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dash-mui-scheduler.onrender.com/">
    <meta property="og:title" content="dash-mui-scheduler — MUI X Scheduler for Plotly Dash">
    <meta property="og:description" content="The MUI X Scheduler — event calendar, timeline, and radial charts — as native Plotly Dash components.">
    <meta property="og:site_name" content="dash-mui-scheduler">
    <meta property="og:image" content="https://dash-mui-scheduler.onrender.com/assets/favicon/android-chrome-512x512.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:image:alt" content="dash-mui-scheduler logo">

    <!-- Twitter — summary (square image); switch back to summary_large_image once a
         dedicated 1200x630 social card exists (see .claude/docs/launch plan). -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:url" content="https://dash-mui-scheduler.onrender.com/">
    <meta property="twitter:title" content="dash-mui-scheduler — MUI X Scheduler for Plotly Dash">
    <meta property="twitter:description" content="The MUI X Scheduler — event calendar, timeline, and radial charts — as native Plotly Dash components.">
    <meta property="twitter:image" content="https://dash-mui-scheduler.onrender.com/assets/favicon/android-chrome-512x512.png">
    <meta property="twitter:image:alt" content="dash-mui-scheduler logo">

    <!-- Favicons (assets/favicon/) -->
    <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <meta name="theme-color" content="#3399ff">
    <link rel="canonical" href="https://dash-mui-scheduler.onrender.com">

    <!-- Structured data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "dash-mui-scheduler",
        "description": "A Plotly Dash wrapper for the MUI X Scheduler: event calendar, timeline, and radial chart components with live documentation.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "author": {"@type": "Organization", "name": "Pip Install Python LLC"}
    }
    </script>

    <!-- LLM discovery -->
    <meta name="llms-txt" content="https://dash-mui-scheduler.onrender.com/llms.txt">
    <meta name="llms-github-repo" content="https://github.com/pip-install-python/dash-mui-scheduler">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Required by Dash — do not modify -->
    {%metas%}
    {%favicon%}
    {%css%}

    <noscript>
        <div style="padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 800px; margin: 0 auto; line-height: 1.6;">
            <h1>dash-mui-scheduler</h1>
            <p><strong>This documentation site requires JavaScript.</strong></p>
            <p>For an LLM-friendly overview of the project, see
               <a href="/llms.txt" style="color: #3399ff;">/llms.txt</a> or any page's
               <code>&lt;page&gt;/llms.txt</code> endpoint.</p>
        </div>
    </noscript>
</head>
<body>
    {%app_entry%}
    <footer>
        {%config%}
        {%scripts%}
        {%renderer%}
