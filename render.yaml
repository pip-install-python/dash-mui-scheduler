# Render blueprint — dash-mui-scheduler docs (single web service, docker runtime).
# Auto-deploys the `release` branch, which only CD writes (see `branch:` below). Serves the component documentation at
# https://muischeduler.2plot.dev (custom domain attached in the Render
# dashboard; the service's own *.onrender.com URL 301s there — see
# CANONICAL_HOST_REDIRECT).
#
# SHIPPED DARK (2026-08-22 gate wave): the interactive sign-in gate is fully
# wired and every page tier is PUBLIC, so nothing is gated. The flip is
# env-only — set PAGE_DEFAULT_TIER=auth once this host's own pre-flight
# passes; rollback is setting it back to public. No code change either way.
#
# SHARED VALUES ARRIVE VIA ENV GROUPS, not from this file. Link all three on
# the service (Render → Environment → Environment Groups):
#   A  2plot-network-shared      the cross-app secret + network URLs
#   B  2plot-satellite-reporting reporting cadence + BOTH /var/data paths
#                                (TRAFFIC_ANALYTICS_FILE, PAGE_VISIBILITY_FILE)
#   C  2plot-clerk-satellite     the whole Clerk block incl. the sign-in
#                                redirect — this is what turns auth ON here
# Only four vars are genuinely per-service: SATELLITE_APP_KEY, APP_BASE_URL,
# SESSION_SECRET (must be UNIQUE per host) and AD_APP_ID. The boot guards
# announce anything missing — a `[visibility]` or `[auth]` warning line in
# the deploy log names it; their ABSENCE is the acceptance check.
#
# FIRST DEPLOY CHECKLIST:
#   1. Create the Blueprint from this repo; fill every `sync: false` secret in
#      the dashboard (values live in the local .env — NEVER committed).
#   2. DASH_BACKEND=fastapi is load-bearing: without it the app boots on flask,
#      /healthz 404s, and Render loops the health check forever.
#   3. APP_BASE_URL drives every absolute URL the site publishes about itself
#      (canonical, og, sitemap, robots, llms) — keep it in sync with the live
#      URL, and see the CANONICAL_HOST_REDIRECT block for the domain-move order.
services:
  - type: web
    name: dash-mui-scheduler-docs
    runtime: docker
    # starter (512MB) is tight for 2 uvicorn workers (~250-300MB resident each
    # with Dash 4.2 + dmc + the eager-loaded docs pages). Either run
    # WEB_WORKERS=1 on starter or move to standard for 2 workers.
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # `release` is written ONLY by CD (.github/workflows/cd.yml, job `deploy`:
    # a fast-forward push of the run's sha after the matrix is green). A push
    # to main is not a deploy. autoDeploy stays on: Render reacting to this
    # branch IS the mechanism (1.6.35). NOTE this field binds only a
    # Blueprint-managed service — on a dashboard-managed one the Branch field
    # in Render is the switch, and it is the owner's to flip.
    branch: release
    autoDeploy: true
    envVars:
      # --- Backend selection (REQUIRED — see checklist #2) ---
      - key: DASH_BACKEND
        value: fastapi
      - key: WEB_WORKERS
        value: "1"

      # --- Public base URL. THE single source of every absolute URL the site
      # emits: canonical links, og:url/og:image, sitemap.xml, robots.txt,
      # llms.txt and the JSON-LD @ids (lib/constants.BASE_URL). Get this wrong
      # and every page canonicalises to a host that isn't the live one.
      #
      # The service also keeps answering on dash-mui-scheduler-docs.onrender.com
      # forever. Two hosts serving identical pages is duplicate content, so
      # CANONICAL_HOST_REDIRECT below 301s that one here.
      - key: APP_BASE_URL
        value: https://muischeduler.2plot.dev

      # --- Send every other host (the *.onrender.com URL) here with a 301.
      # DO THIS IN ORDER — enabling it before DNS resolves bounces every
      # visitor to a host that isn't answering:
      #   1. Render → Settings → Custom Domains → add muischeduler.2plot.dev.
      #   2. At the 2plot.dev DNS provider add the CNAME Render shows
      #      (muischeduler → <service>.onrender.com); wait for Verified + the
      #      TLS certificate to be issued.
      #   3. Confirm https://muischeduler.2plot.dev serves the docs.
      #   4. THEN set APP_BASE_URL above and this flag, and redeploy.
      # /healthz, /assets, /_dash*, /api/* and /webhooks are never redirected
      # (a 3xx on the health check would fail the deploy) — lib/canonical_host.py.
      - key: CANONICAL_HOST_REDIRECT
        value: "0"

      # --- MUI X license (perpetual LICENSE key, not metered — set it).
      # The docs examples read MUI_X_LICENSE_KEY (licenseKey=os.environ.get("MUI_X_LICENSE_KEY", "")).
      # Locally the same value lives in .env as MUI_PRO_API_KEY with an
      # MUI_X_LICENSE_KEY=${MUI_PRO_API_KEY} alias line.
      - key: MUI_X_LICENSE_KEY
        sync: false

      # --- Network analytics: report this app's traffic to 2plot.ai ---
      # 2plot.ai is the analytics home for the whole network;
      # lib/satellite_reporter POSTs an hourly signed rollup (hits, visitors,
      # sessions, top pages, countries) to https://2plot.ai/api/satellite/traffic,
      # which is what puts this app on the owner-only /traffic dashboard. The
      # secret is the SAME CROSS_APP_WEBHOOK_SECRET every satellite holds —
      # unset it and the reporter is a clean no-op (and the app never appears
      # on /traffic).
      - key: CROSS_APP_WEBHOOK_SECRET
        sync: false
      # ONE short app id, network-wide (the subdomain slug / hub directory
      # key). AD_APP_ID and the bulletin app_id follow this value in code.
      - key: SATELLITE_APP_KEY
        value: muischeduler

      # --- Network bulletin (hub tips/announcements in the llms.txt viewer).
      # ⚠️ Blueprint envVars apply on BLUEPRINT SYNC only, not on git-push
      # autodeploys — set this on the SERVICE in the Render dashboard too, or
      # the viewer keeps rendering one generic package tip and nothing looks
      # broken. Boot log states "network bulletin: wired/off".
      - key: NETWORK_BULLETIN_URL
        value: https://2plot.dev/api/network/bulletin

      # Access tiers for the tiered corpus documents (/llms-small.txt,
      # /llms-full.txt — dash-improve-my-llms >= 2.4.0). Deliberately set to
      # the default here so every fork SEES the knob: the 402 experiment
      # tightens the full corpus by flipping this to `auth`, per satellite,
      # with no code change. See .env.example for the tier values.
      - key: LLMS_SMALL_TIER
        value: public
      - key: LLMS_FULL_TIER
        value: public

      # The hub takes the LAST report for a given (app, date). On an ephemeral
      # filesystem a mid-day deploy wipes the ledger and the next hourly report
      # overwrites the day's real total with whatever accrued since the
      # restart. The disk below is what stops that. Keep WEB_WORKERS=1 — one
      # process owns the ledger and one reporter speaks for the app.
      # SATELLITE_REPORT_INTERVAL_S (default 3600) tunes the report cadence;
      # ANALYTICS_MAX_VISITS (default 20000) caps the ledger.
      - key: TRAFFIC_ANALYTICS_FILE
        value: /var/data/visitor_analytics.json

      # --- The interactive gate. SHIPPED DARK, DELIBERATELY EXPLICIT. ---
      # `public` is also the code default, so this line changes nothing today.
      # It is here because the flip is the whole point: an operator who has to
      # ADD the variable to gate the site cannot see, from the service's
      # environment, that gating is even possible. Set to `auth` after this
      # host's pre-flight (one real sign-in round trip from the card to the
      # hub and back). Rolling back is setting it to `public` again.
      #
      # NOTE it does NOT gate the corpus documents — LLMS_SMALL_TIER and
      # LLMS_FULL_TIER above are registered with an explicit `or "public"` in
      # run.py precisely so flipping the interactive site never silently
      # closes the machine window.
      - key: PAGE_DEFAULT_TIER
        value: public

      # LLMS_PUBLIC_DEFAULT stays UNSET network-wide until phase 4 — unset
      # means the machine surfaces stay open even on gated pages, which is
      # the data-window posture the whole network is holding.

      # The control board's override store. Group B delivers this too; it is
      # restated here because it MUST land on the same 1GB disk as the
      # analytics ledger — on the container filesystem every deploy silently
      # wipes the board (leaflet ran that way for weeks). A missing value is
      # named by the `[visibility]` boot warning.
      - key: PAGE_VISIBILITY_FILE
        value: /var/data/page_visibility.json

      # --- Clerk satellite auth (values arrive via env group C) ---
      # 2plot.ai is the PRIMARY; every 2plot.* host is a SATELLITE sharing one
      # Clerk app. Declared here as documentation of the contract — the group
      # supplies the values, and SESSION_SECRET must be unique per service:
      #   CLERK_SECRET_KEY          sk_...   backend SDK key
      #   CLERK_PUBLISHABLE_KEY     pk_...   embedded in the injected script
      #   CLERK_SIGN_IN_URL         https://accounts.2plot.ai/sign-in
      #   CLERK_FRONTEND_API        https://clerk.2plot.ai  (REQUIRED on a
      #                             custom-domain instance — it cannot be
      #                             derived from CLERK_SIGN_IN_URL)
      #   CLERK_IS_SATELLITE        true
      #   CLERK_SATELLITE_DOMAIN    muischeduler.2plot.dev
      #   SESSION_SECRET            UNIQUE per service (sync: false)
      #   CLERK_SATELLITE_SIGN_IN_REDIRECT  https://2plot.ai/onboarding
      #     ^ unset strands authenticated users on the primary, silently; a
      #       truthy non-URL 404s the Sign In button, which is worse. lib/auth
      #       boot-guards both — the absence of its two [auth] warnings in the
      #       deploy log is the acceptance check for this variable.
      - key: SESSION_SECRET
        sync: false

      # --- Optional ---
      # - key: DASH_MCP_ENABLED        # needs dash>=4.3; no-op on 4.2
      #   value: "1"

    # A DECLARATION ATTACHES NOTHING. Verify in the dashboard's Disks tab, or
    # trust the boot guards: a `[visibility]` warning names exactly which half
    # is missing. The disk carries BOTH the analytics ledger and the control
    # board's override store; without it every deploy wipes both.
    disk:
      name: app-state
      mountPath: /var/data
      sizeGB: 1
